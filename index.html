<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tuffish.bot</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="page-header">
    <div>
      <div class="eyebrow">CHESSY CHESS</div>
      <h1>Play against the bots</h1>
      <p>Tuffish is the only best bot</p>
    </div>
    <div class="live-label"><span></span> For best performance, use a strong wifi and a strong device</div>
  </header>

  <div class="controls">
    <label class="control-field">
      Play as
      <select id="sideSelect" onchange="resetGame()">
        <option value="w">White</option>
        <option value="b">Black</option>
      </select>
    </label>

    <div class="difficulty-field">
      <span class="field-label">Bot difficulty</span>

      <div class="difficulty-options" role="group" aria-label="Choose bot difficulty">
        <button class="difficulty-option" data-level="easy" type="button">
          <strong>Ezrabot</strong>
          <small>this bot is not tuff</small>
        </button>

        <button class="difficulty-option active" data-level="medium" type="button">
          <strong>Blunderbus</strong>
          <small>this bot is mildly tuff</small>
        </button>

        <button class="difficulty-option" data-level="hard" type="button">
          <strong>Tuffish</strong>
          <small>this bot is damn tuff</small>
        </button>
      </div>

      <select id="difficultySelect" class="visually-hidden" aria-hidden="true" tabindex="-1">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>

    <button class="new-game" onclick="resetGame()">
      New Game <span>↗</span>
    </button>
  </div>

  <div id="status" role="status" aria-live="polite">
    Your turn (White)
  </div>

  <div class="board-wrapper">
    <div id="board"></div>

    <div id="promoModal">
      <div class="promo-box">
        <div>Choose promotion piece:</div>
        <div class="promo-choices" id="promoChoices"></div>
      </div>
    </div>
  </div>
</body>
</html>
